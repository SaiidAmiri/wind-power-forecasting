name: CI/CD Pipeline

on:
  push:
    branches: [ main ]


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push wind-power-api image
      - name: Build, Tag, and Push wind-power-api
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ECR_REGISTRY=652953065856.dkr.ecr.eu-central-1.amazonaws.com
          ECR_REPOSITORY=wind-power-api

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Build and push wind-power-streamlit image
      - name: Build, Tag, and Push wind-power-streamlit
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ECR_REGISTRY=652953065856.dkr.ecr.eu-central-1.amazonaws.com
          ECR_REPOSITORY=wind-power-streamlit

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile.streamlit .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      
      # Deploy to ECS - API
      - name: Deploy wind-power-api-service
        run: |
          aws ecs update-service \
          --cluster wind-power-api-cluster-ecs \
          --service wind-power-api-service \
          --force-new-deployment

      # Deploy to ECS - Streamlit
      - name: Deploy wind-power-streamlit-service
        run: |
          aws ecs update-service \
          --cluster wind-power-api-cluster-ecs \
          --service wind-power-streamlit-service \
          --force-new-deployment
